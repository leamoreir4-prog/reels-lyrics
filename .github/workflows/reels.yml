name: Reels diarios

on:
  schedule:
    # Uruguay = UTC-3. Estas ejecuciones DEJAN PROGRAMADOS en Facebook los reels de hoy
    # (14:00 y 18:00 UY); Facebook los publica a la hora. El segundo disparo es de respaldo.
    - cron: "17 10 * * *"   # 07:17 UY
    - cron: "17 12 * * *"   # 09:17 UY (respaldo; si el primero ya programó, no hace nada)
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publicar de inmediato (sin esperar el horario)"
        type: boolean
        default: true
      test_schedule:
        description: "Prueba: programar UN reel para dentro de 30 min (verifica que Facebook acepte programar)"
        type: boolean
        default: false
      dry_run:
        description: "Solo generar el video (no publica) y dejarlo como artefacto"
        type: boolean
        default: false

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Cache modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('src/config.py') }}

      - name: Generar y publicar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_PHOTOS_FOLDER_ID: ${{ secrets.DRIVE_PHOTOS_FOLDER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TEST_SCHEDULE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_schedule }}
          PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python -m src.main

      - name: Vista previa (solo dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: reel_preview
          path: reel_preview.mp4

      - name: Guardar rotación de canciones
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          [ -f state/used.json ] || { echo "Nada que guardar"; exit 0; }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state/used.json
          git diff --cached --quiet || (git commit -m "actualizar canciones usadas" && git push)
